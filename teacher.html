<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0a1e" />
    <title>روز معلم مبارک | شمعی که راه را روشن کرد</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        font-family: "Vazirmatn", sans-serif;
        background: #06010f;
        color: #fff;
      }

      /* ============================================
     🌌 پس‌زمینه‌ی آسمانی
     ============================================ */
      .sky {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: radial-gradient(
          ellipse at 50% 30%,
          #2a1550 0%,
          #14062e 45%,
          #06010f 100%
        );
        overflow: hidden;
      }

      /* ستاره‌های ثابت پس‌زمینه */
      .sky::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
          radial-gradient(1px 1px at 28% 42%, #ffe6a8, transparent),
          radial-gradient(1.5px 1.5px at 45% 12%, #fff, transparent),
          radial-gradient(1px 1px at 62% 28%, #c9a8ff, transparent),
          radial-gradient(1.5px 1.5px at 78% 22%, #fff, transparent),
          radial-gradient(1px 1px at 88% 48%, #ffe6a8, transparent),
          radial-gradient(1.5px 1.5px at 18% 62%, #fff, transparent),
          radial-gradient(1px 1px at 35% 78%, #c9a8ff, transparent),
          radial-gradient(1.5px 1.5px at 72% 72%, #fff, transparent),
          radial-gradient(1px 1px at 85% 82%, #ffe6a8, transparent),
          radial-gradient(1px 1px at 8% 88%, #fff, transparent),
          radial-gradient(1.5px 1.5px at 55% 58%, #fff, transparent);
        background-size: 100% 100%;
        animation: twinkle 5s ease-in-out infinite;
        opacity: 0.7;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      /* ============================================
     🌟 نور از بالای صفحه (هاله‌ی طلایی)
     ============================================ */
      .top-glow {
        position: fixed;
        top: -30vh;
        left: 50%;
        transform: translateX(-50%);
        width: 140vw;
        height: 70vh;
        background: radial-gradient(
          ellipse at center bottom,
          rgba(255, 210, 120, 0.28) 0%,
          rgba(255, 160, 60, 0.1) 30%,
          transparent 70%
        );
        filter: blur(40px);
        z-index: 1;
        pointer-events: none;
        animation: breathe 6s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.7;
          transform: translateX(-50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) scale(1.08);
        }
      }

      /* ============================================
     ✨ ستاره‌های زنده (که از شمع می‌آیند)
     ============================================ */
      .stars-live {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        overflow: hidden;
      }

      .live-star {
        position: absolute;
        color: #ffd966;
        font-size: 14px;
        text-shadow:
          0 0 8px #ffd966,
          0 0 16px #ffa500,
          0 0 30px rgba(255, 165, 0, 0.6);
        opacity: 0;
        animation: rise 5s ease-out forwards;
      }

      @keyframes rise {
        0% {
          opacity: 0;
          transform: translateY(0) translateX(0) scale(0.3) rotate(0deg);
        }
        15% {
          opacity: 1;
          transform: translateY(-20vh) translateX(var(--tx, 0px)) scale(1)
            rotate(60deg);
        }
        100% {
          opacity: 0;
          transform: translateY(-95vh) translateX(var(--tx, 0px)) scale(0.6)
            rotate(360deg);
        }
      }

      /* ============================================
     💫 کارت مرکزی
     ============================================ */
      .stage {
        position: relative;
        z-index: 5;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 30px);
        padding-top: max(clamp(30px, 6vh, 60px), env(safe-area-inset-top));
        padding-bottom: max(
          clamp(20px, 4vh, 40px),
          env(safe-area-inset-bottom)
        );
        gap: clamp(18px, 4vh, 34px);
      }

      /* ============================================
     🕯️ شمع (کاملاً CSS - بدون SVG)
     ============================================ */
      .candle-wrap {
        position: relative;
        width: clamp(90px, 22vw, 140px);
        height: clamp(180px, 34vw, 240px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        animation: float 4s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      /* شعله */
      .flame {
        position: relative;
        width: clamp(20px, 5vw, 32px);
        height: clamp(36px, 8vw, 55px);
        margin-bottom: -4px;
        border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
        background: radial-gradient(
          ellipse at 50% 70%,
          #fff 0%,
          #ffe680 20%,
          #ffb347 45%,
          #ff6b1a 75%,
          transparent 100%
        );
        box-shadow:
          0 0 20px rgba(255, 215, 0, 0.9),
          0 0 40px rgba(255, 165, 0, 0.7),
          0 0 80px rgba(255, 100, 0, 0.5),
          0 0 120px rgba(255, 100, 0, 0.3);
        animation:
          flicker 0.3s ease-in-out infinite alternate,
          flameTilt 2.5s ease-in-out infinite;
        transform-origin: bottom center;
        z-index: 2;
      }

      /* هسته‌ی سفید شعله */
      .flame::before {
        content: "";
        position: absolute;
        bottom: 15%;
        left: 50%;
        transform: translateX(-50%);
        width: 40%;
        height: 45%;
        border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
        background: radial-gradient(
          ellipse at 50% 70%,
          #fff 0%,
          #fff8e0 60%,
          transparent 100%
        );
        filter: blur(1px);
      }

      @keyframes flicker {
        0% {
          box-shadow:
            0 0 20px rgba(255, 215, 0, 0.9),
            0 0 40px rgba(255, 165, 0, 0.7),
            0 0 80px rgba(255, 100, 0, 0.5);
        }
        100% {
          box-shadow:
            0 0 25px rgba(255, 215, 0, 1),
            0 0 50px rgba(255, 165, 0, 0.85),
            0 0 100px rgba(255, 100, 0, 0.6);
        }
      }

      @keyframes flameTilt {
        0%,
        100% {
          transform: rotate(-3deg) scaleY(1);
        }
        50% {
          transform: rotate(3deg) scaleY(1.05);
        }
      }

      /* هاله‌ی نور دور شعله */
      .flame::after {
        content: "";
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%);
        width: clamp(60px, 15vw, 100px);
        height: clamp(60px, 15vw, 100px);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 215, 0, 0.5) 0%,
          rgba(255, 165, 0, 0.25) 30%,
          transparent 70%
        );
        filter: blur(15px);
        animation: haloPulse 2s ease-in-out infinite;
        pointer-events: none;
        z-index: -1;
      }

      @keyframes haloPulse {
        0%,
        100% {
          opacity: 0.6;
          transform: translateX(-50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) scale(1.2);
        }
      }

      /* بدن شمع */
      .candle-body {
        position: relative;
        width: clamp(38px, 9vw, 55px);
        height: clamp(110px, 22vw, 150px);
        border-radius: 6px 6px 4px 4px;
        background: linear-gradient(
          90deg,
          #f5e6c8 0%,
          #fff8e0 25%,
          #fdf2d0 50%,
          #f0dcb0 75%,
          #e8d0a0 100%
        );
        box-shadow:
          inset -8px 0 15px rgba(180, 140, 80, 0.3),
          inset 8px 0 15px rgba(255, 255, 240, 0.4),
          0 10px 30px rgba(0, 0, 0, 0.5);
        z-index: 1;
      }

      /* رگه‌های موم روی شمع */
      .candle-body::before {
        content: "";
        position: absolute;
        top: 15%;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(200, 160, 100, 0.4),
          transparent
        );
        box-shadow:
          0 20px 0 rgba(200, 160, 100, 0.3),
          0 45px 0 rgba(200, 160, 100, 0.35),
          0 70px 0 rgba(200, 160, 100, 0.25);
      }

      /* موم ذوب شده که می‌ریزد */
      .candle-body::after {
        content: "";
        position: absolute;
        top: -4px;
        right: 20%;
        width: 8px;
        height: 25px;
        background: linear-gradient(
          180deg,
          #fff8e0 0%,
          rgba(255, 248, 224, 0.3) 100%
        );
        border-radius: 50% 50% 40% 40%;
        filter: blur(0.5px);
      }

      /* پایه‌ی شمع */
      .candle-base {
        position: relative;
        width: clamp(70px, 16vw, 100px);
        height: clamp(10px, 2.5vw, 14px);
        border-radius: 50%;
        background: linear-gradient(180deg, #8b6b3a, #4a3520);
        box-shadow:
          0 6px 20px rgba(0, 0, 0, 0.6),
          inset 0 2px 4px rgba(255, 200, 100, 0.3);
        margin-top: -3px;
        z-index: 0;
      }

      /* درخشش زیر شمع روی پایه */
      .candle-wrap::after {
        content: "";
        position: absolute;
        bottom: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 140%;
        height: 30px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse,
          rgba(255, 180, 60, 0.4) 0%,
          transparent 70%
        );
        filter: blur(12px);
        pointer-events: none;
      }

      /* ============================================
     ✍️ متن‌ها
     ============================================ */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: clamp(6px, 1.5vw, 9px) clamp(14px, 3vw, 22px);
        border-radius: 100px;
        background: rgba(255, 215, 100, 0.08);
        border: 1px solid rgba(255, 215, 100, 0.35);
        color: #ffd966;
        font-size: clamp(10px, 2.4vw, 13px);
        font-weight: 600;
        letter-spacing: 0.5px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 0 25px rgba(255, 215, 100, 0.15);
        animation: fadeInUp 1s ease-out 0.2s both;
      }

      .badge i {
        font-size: 0.9em;
      }

      .title-block {
        text-align: center;
        animation: fadeInUp 1s ease-out 0.4s both;
      }

      .title {
        font-size: clamp(26px, 8vw, 52px);
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: -0.5px;
        background: linear-gradient(
          135deg,
          #fff8e0 0%,
          #ffd966 25%,
          #ffb347 50%,
          #ffd966 75%,
          #fff8e0 100%
        );
        background-size: 300% 300%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 25px rgba(255, 200, 80, 0.4));
        animation: shift 5s ease infinite;
      }

      @keyframes shift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .title-en {
        margin-top: 8px;
        font-size: clamp(9px, 2.2vw, 12px);
        font-weight: 400;
        letter-spacing: clamp(3px, 0.9vw, 5px);
        color: rgba(255, 248, 224, 0.5);
        text-transform: uppercase;
      }

      /* جداکننده‌ی زیبا */
      .divider {
        display: flex;
        align-items: center;
        gap: clamp(8px, 2vw, 14px);
        animation: fadeInUp 1s ease-out 0.6s both;
      }

      .divider .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ffd966;
        box-shadow:
          0 0 12px #ffd966,
          0 0 24px rgba(255, 180, 60, 0.7);
        animation: dotPulse 2s ease-in-out infinite;
      }

      .divider .dot:nth-child(2) {
        animation-delay: 0.3s;
      }
      .divider .dot:nth-child(4) {
        animation-delay: 0.6s;
      }

      .divider .line {
        width: clamp(30px, 8vw, 60px);
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 215, 100, 0.6),
          transparent
        );
      }

      @keyframes dotPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.4);
          opacity: 1;
        }
      }

      /* پیام اصلی */
      .poem {
        max-width: 480px;
        text-align: center;
        font-size: clamp(13px, 3.2vw, 17px);
        line-height: 2.1;
        color: rgba(255, 248, 224, 0.85);
        font-weight: 300;
        animation: fadeInUp 1s ease-out 0.8s both;
      }

      .poem .hl {
        color: #ffd966;
        font-weight: 700;
        text-shadow: 0 0 15px rgba(255, 215, 100, 0.6);
      }

      .poem .signature-line {
        display: block;
        margin-top: 14px;
        font-size: 0.9em;
        color: rgba(255, 248, 224, 0.55);
        font-weight: 400;
      }

      .poem .author {
        color: #ffd966;
        font-weight: 700;
        font-style: italic;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* امضا */
      .footer {
        text-align: center;
        font-size: clamp(10px, 2.4vw, 12px);
        color: rgba(255, 248, 224, 0.45);
        letter-spacing: 1px;
        animation: fadeInUp 1s ease-out 1s both;
      }

      .footer .name {
        display: block;
        margin-top: 6px;
        color: #ffd966;
        font-weight: 700;
        font-size: 1.15em;
        letter-spacing: 0.5px;
      }

      .footer .heart {
        color: #ff6b8a;
        animation: beat 1.2s ease-in-out infinite;
        display: inline-block;
        margin: 0 4px;
      }

      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.3);
        }
      }

      /* ============================================
     🌟 جرقه‌های اطراف شمع
     ============================================ */
      .spark {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #ffd966;
        box-shadow:
          0 0 8px #ffd966,
          0 0 16px #ffa500;
        pointer-events: none;
        animation: sparkFloat 3s ease-out infinite;
      }

      @keyframes sparkFloat {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.5);
        }
        20% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx, 30px), var(--dy, -80px)) scale(0.3);
        }
      }

      /* ============================================
     📱 ریسپانسیو
     ============================================ */
      @media (max-width: 380px) {
        .title {
          font-size: 26px;
        }
        .poem {
          font-size: 12.5px;
          line-height: 2;
        }
      }

      @media (min-width: 381px) and (max-width: 640px) {
        .title {
          font-size: clamp(30px, 8vw, 38px);
        }
      }

      @media (min-width: 641px) and (max-width: 900px) {
        .title {
          font-size: 46px;
        }
        .poem {
          font-size: 16px;
        }
      }

      @media (min-width: 901px) {
        .title {
          font-size: 54px;
        }
        .poem {
          font-size: 17px;
        }
        .stage {
          gap: 28px;
        }
      }

      /* حالت افقی موبایل */
      @media (max-height: 520px) and (orientation: landscape) {
        .stage {
          flex-direction: row;
          justify-content: space-around;
          padding: 12px 20px;
          gap: 20px;
        }
        .candle-wrap {
          height: 180px;
          width: 70px;
        }
        .flame {
          width: 18px;
          height: 30px;
        }
        .candle-body {
          width: 32px;
          height: 90px;
        }
        .title {
          font-size: 26px;
        }
        .poem {
          font-size: 12px;
          line-height: 1.8;
        }
        .title-block,
        .divider,
        .poem,
        .footer {
          text-align: left;
        }
        .stage > *:not(.candle-wrap) {
          text-align: right;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- 🌌 آسمان -->
    <div class="sky"></div>
    <div class="top-glow"></div>

    <!-- ✨ ستاره‌های زنده -->
    <div class="stars-live" id="starsLive"></div>

    <!-- 📇 استیج اصلی -->
    <div class="stage">
      <!-- 🕯️ شمع -->
      <div class="candle-wrap">
        <div class="flame"></div>
        <div class="candle-body"></div>
        <div class="candle-base"></div>
      </div>

      <!-- 🏷️ برچسب تاریخ -->
      <div class="badge">
        <i class="fa-solid fa-star"></i>
        <span>۱۳ میزان — روز معلم</span>
        <i class="fa-solid fa-star"></i>
      </div>

      <!-- 📝 عنوان -->
      <div class="title-block">
        <h1 class="title">روز معلم مبارک</h1>
        <p class="title-en">Happy Teacher's Day</p>
      </div>

      <!-- 🌟 جداکننده -->
      <div class="divider">
        <span class="dot"></span>
        <span class="line"></span>
        <span class="dot"></span>
        <span class="line"></span>
        <span class="dot"></span>
      </div>

      <!-- 💫 پیام -->
      <p class="poem">
        ای <span class="hl">شمع فروزان</span> وجود،<br />
        که در دل تاریکی، راه را نشان دادی،<br />
        و با هر کلمه، <span class="hl">جهانی</span> در ما ساختی...<br />
        <span class="signature-line">
          با تمام وجود، <span class="author">سپاسگزاریم</span> 🌷
        </span>
      </p>

      <!-- ✍️ امضا -->
      <div class="footer">
        تقدیم به معلمان عزیز افغانستان
        <span class="name">
          <i class="fa-solid fa-heart heart"></i>
          حشمت الله محمدی
          <i class="fa-solid fa-heart heart"></i>
        </span>
      </div>
    </div>

    <script>
      const candleWrap = document.querySelector(".candle-wrap");

      function createSpark() {
        const s = document.createElement("div");
        s.className = "spark";
        const startAngle = Math.random() * Math.PI * 2;
        const radius = 8 + Math.random() * 10;
        s.style.left = `calc(50% + ${Math.cos(startAngle) * radius}px)`;
        s.style.top = `${5 + Math.random() * 20}px`;
        s.style.setProperty("--dx", (Math.random() - 0.5) * 100 + "px");
        s.style.setProperty("--dy", -(40 + Math.random() * 80) + "px");
        s.style.animationDuration = 2 + Math.random() * 2 + "s";
        candleWrap.appendChild(s);
        setTimeout(() => s.remove(), 4000);
      }

      setInterval(createSpark, 350);
      for (let i = 0; i < 4; i++) setTimeout(createSpark, i * 200);

      const starsLive = document.getElementById("starsLive");

      function createLiveStar() {
        const s = document.createElement("i");
        s.className = "fa-solid fa-star live-star";
        const startX = 50 + (Math.random() - 0.5) * 6;
        s.style.left = startX + "vw";
        s.style.bottom = 30 + Math.random() * 10 + "%";
        s.style.fontSize = 8 + Math.random() * 12 + "px";
        s.style.setProperty("--tx", (Math.random() - 0.5) * 60 + "vw");
        const colors = ["#ffd966", "#fff8e0", "#ffb347", "#ffa500", "#fff"];
        const c = colors[Math.floor(Math.random() * colors.length)];
        s.style.color = c;
        s.style.textShadow = `0 0 8px ${c}, 0 0 16px ${c}, 0 0 30px rgba(255, 165, 0, 0.6)`;
        s.style.animationDuration = 4 + Math.random() * 3 + "s";
        starsLive.appendChild(s);
        setTimeout(() => s.remove(), 7000);
      }

      setInterval(createLiveStar, 600);
      for (let i = 0; i < 5; i++) setTimeout(createLiveStar, i * 300);

      /* ============================================
     🎯 افکت تیلت ملایم کارت به موس (فقط دسکتاپ)
     ============================================ */
      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        const stage = document.querySelector(".stage");
        let mx = 0,
          my = 0,
          cx = 0,
          cy = 0;

        window.addEventListener("mousemove", (e) => {
          mx = (e.clientX / window.innerWidth - 0.5) * 2;
          my = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        (function animate() {
          cx += (mx - cx) * 0.05;
          cy += (my - cy) * 0.05;
          // حرکت ملایم کل استیج (نه فقط کارت)
          stage.style.transform = `perspective(1500px) rotateY(${cx * 1.5}deg) rotateX(${-cy * 1.5}deg)`;
          requestAnimationFrame(animate);
        })();
      }

      /* ============================================
     🎵 (اختیاری) انفجار کوچک ستاره‌ها با کلیک
     ============================================ */
      document.body.style.cursor = "pointer";
      document.body.addEventListener("click", (e) => {
        // از نقطه‌ی کلیک، ۱۵ ستاره بیرون می‌پرد
        for (let i = 0; i < 15; i++) {
          const angle = (Math.PI * 2 * i) / 15;
          const dist = 100 + Math.random() * 100;
          const s = document.createElement("i");
          s.className = "fa-solid fa-star";
          s.style.position = "fixed";
          s.style.left = e.clientX + "px";
          s.style.top = e.clientY + "px";
          s.style.color = "#ffd966";
          s.style.fontSize = 8 + Math.random() * 10 + "px";
          s.style.pointerEvents = "none";
          s.style.zIndex = "999";
          s.style.textShadow = "0 0 10px #ffd966, 0 0 20px #ffa500";
          s.style.transition =
            "transform 1s cubic-bezier(.2,.9,.3,1), opacity 1s ease-out";
          document.body.appendChild(s);

          requestAnimationFrame(() => {
            s.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(0.3) rotate(${Math.random() * 360}deg)`;
            s.style.opacity = "0";
          });

          setTimeout(() => s.remove(), 1100);
        }
      });
    </script>
  </body>
</html>
